<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OOKA&#x20;Support&#x20;Form</title>
  <link href="css/form.css" rel="stylesheet" type="text/css" />
  <script src="js/validation.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
    rel="stylesheet" />
</head>

<body class="zf-backgroundBg">
  <!-- Change or deletion of the name attributes in the input tag will lead to empty values on record submission-->
  <div class="zf-templateWidth">
    <!---------template Header Starts Here---------->
    <ul class="zf-tempHeadBdr">
      <li class="zf-tempHeadContBdr">
        <h2 class="zf-frmTitle"><em>SEND US A MESSAGE</em></h2>
        <p class="zf-frmDesc"></p>
        <div class="zf-clearBoth"></div>
      </li>
    </ul>
    <!---------template Header Ends Here---------->
    <form
      action="https://forms.zohopublic.com/airglobal/form/OOKASupportForm/formperma/sUHkjiOZw8Ik7igJM--eGP7HLmpz-6whYbLbvSTedgk/htmlRecords/submit"
      name="form" method="POST" onSubmit='javascript:document.charset="UTF-8"; return zf_ValidateAndSubmit();'
      accept-charset="UTF-8" enctype="multipart/form-data" id="form">
      <input type="hidden" name="zf_referrer_name"
        value="" /><!-- To Track referrals , place the referrer name within the " " in the above hidden input field -->
      <input type="hidden" name="zf_redirect_url"
        value="" /><!-- To redirect to a specific page after record submission , place the respective url within the " " in the above hidden input field -->
      <input type="hidden" name="zc_gad"
        value="" /><!-- If GCLID is enabled in Zoho CRM Integration, click details of AdWords Ads will be pushed to Zoho CRM -->
      <div class="zf-templateWrapper">
        <!---------template Container Starts Here---------->
        <div class="zf-subContWrap zf-topAlign">
          <ul>
            <!---------Single Line Starts Here---------->
            <li>
              <div class="zf-tempContDiv one-line">
                <span class="zf-tempFrmWrapper zf-large wid">
                  <label class="zf-labelName">First Name <em class="zf-important">*</em></label><input type="text"
                    maxlength="255" name="Name_First" fieldType="7" placeholder="" />
                </span>
                <span class="zf-tempFrmWrapper zf-large wid">
                  <label class="zf-labelName">Last Name <em class="zf-important">*</em></label><input type="text"
                    maxlength="255" name="Name_Last" fieldType="7" placeholder="" />
                  <p id="Name_error" class="zf-errorMessage" style="display: none">
                    Invalid value
                  </p>
                </span>
              </div>
              <div class="zf-clearBoth"></div>
            </li>
            <div class="one-line">
              <!---------Single Line Ends Here---------->
              <!---------Email Starts Here---------->
              <li class="zf-tempFrmWrapper zf-large wid">
                <label class="zf-labelName">
                  Email
                  <em class="zf-important">*</em>
                </label>
                <div class="zf-tempContDiv">
                  <span id="loaderContainer">
                    <input fieldType="9" type="text" maxlength="255" name="Email" checktype="c5" value="" placeholder=""
                      id="Email" />
                    <div id="loader"></div>
                  </span>
                  <p id="Email_error" class="zf-errorMessage" style="display: none">
                    Invalid value
                  </p>
                </div>
                <div class="zf-clearBoth"></div>
              </li>
              <!---------Email Ends Here---------->
              <!---------Phone Starts Here---------->
              <li class="zf-tempFrmWrapper zf-large wid">
                <label class="zf-labelName"> Phone</label>
                <div class="zf-tempContDiv zf-phonefld">
                  <div class="zf-phwrapper zf-phNumber">
                    <span>
                      <input type="text" compname="PhoneNumber" name="PhoneNumber_countrycode" maxlength="20"
                        checktype="c7" value="" phoneFormat="1" isCountryCodeEnabled="false" fieldType="11"
                        id="international_PhoneNumber_countrycode" valType="number" phoneFormatType="1"
                        placeholder="" />
                    </span>
                    <div class="zf-clearBoth"></div>
                  </div>
                  <p id="PhoneNumber_error" class="zf-errorMessage" style="display: none">
                    Invalid value
                  </p>
                </div>
                <div class="zf-clearBoth"></div>
              </li>
              <!---------Phone Ends Here---------->
            </div>
            <div class="one-line">
              <!---------Dropdown Starts Here---------->
              <li class="zf-tempFrmWrapper zf-large wid">
                <label class="zf-labelName">
                  Reason for contacting us
                  <em class="zf-important">*</em></label>
                <div class="zf-tempContDiv">
                  <select class="zf-form-sBox" id="contactReason" name="Dropdown" checktype="c1">
                    <option selected="true" value="-Select-">-Select-</option>
                                    <optgroup label="My Order">
                                        <option value="Order Status">Order Status</option>
                                        <option value="Follow Up">Follow Up</option>
                                        <option value="PAE (Potential Adverse Events)">PAE (Potential Adverse Events)
                                        </option>
                                        <option value="Return">Return</option>
                                        <option value="Repair Service">Repair Service</option>
                                        <option value="Payment inquiries">Payment inquiries</option>
                                        <option value="Delivery">Delivery</option>
                                        <option value="Warranty Registration">Warranty Registration</option>
                                    </optgroup>
                                    <optgroup label="Account Help">
                                        <option value="Update Account Information">Update Account Information</option>
                                        <option value="Forgot Password">Forgot Password</option>
                                        <option value="Other Login Issue">Other Login Issue</option>
                                        <option value="Login Issue">Login Issue</option>
                                    </optgroup>
                                    <optgroup label="Website Support">
                                        <option value="Promo Code Issue">Promo Code Issue</option>
                                        <option value="Website Issue">Website Issue</option>
                                        <option value="Other">Other</option>
                                    </optgroup>
                                    <optgroup label="Wholesale Inquiry">
                                        <option value="Wholesale Account Information">Wholesale Account Information
                                        </option>
                                    </optgroup>
                                    <optgroup label="General Inquiries">
                                        <option value="Product Assembly">Product Assembly</option>
                                        <option value="Affiliate Information Request">Affiliate Information Request
                                        </option>
                                        <option value="Marketing Inquiry">Marketing Inquiry</option>
                                        <option value="Product Request">Product Request</option>
                                        <option value="Vendor Inquiry">Vendor Inquiry</option>
                                        <option value="Other">Other</option>
                                    </optgroup>
                  </select>
                  <p id="Dropdown_error" class="zf-errorMessage" style="display: none">
                    Invalid value
                  </p>
                </div>
                <div class="zf-clearBoth"></div>
              </li>
              <!---------Dropdown Ends Here---------->
              <!---------Single Line Starts Here---------->
              <li class="zf-tempFrmWrapper zf-large wid">
                <label class="zf-labelName"> Order Number (optional) </label>
                <div class="zf-tempContDiv">
                  <span>
                    <input type="text" name="SingleLine1" checktype="c1" value="" maxlength="255" fieldType="1"
                      placeholder="" /></span>
                  <p id="SingleLine1_error" class="zf-errorMessage" style="display: none">
                    Invalid value
                  </p>
                </div>
                <div class="zf-clearBoth"></div>
              </li>
              <!---------Single Line Ends Here---------->
            </div>
            <!---------Single Line Starts Here---------->
            <li class="zf-tempFrmWrapper zf-large">
              <label class="zf-labelName">
                Subject
                <em class="zf-important">*</em>
              </label>
              <div class="zf-tempContDiv">
                <span>
                  <input type="text" name="SingleLine2" checktype="c1" value="" maxlength="255" fieldType="1"
                    placeholder="" /></span>
                <p id="SingleLine2_error" class="zf-errorMessage" style="display: none">
                  Invalid value
                </p>
              </div>
              <div class="zf-clearBoth"></div>
            </li>
            <li class="zf-tempFrmWrapper zf-large ticket-id-wrapper" id="ticketIdWrapper">
              <label class="zf-labelName" id="ticketIdLabel">
                Ticket ID
                <em class="zf-important ticket-id-required" id="ticketIdRequired">*</em>
              </label>
              <div class="zf-tempContDiv">
                <span>
                  <input type="text" name="SingleLine" id="ticketIdInput" checktype="c9" value="" maxlength="20"
                    fieldType="1" placeholder="Enter Ticket ID" inputmode="numeric" pattern="[0-9]*"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '');" disabled />
                </span>
                <p id="SingleLine_error" class="zf-errorMessage" style="display: none;">Please enter a valid Ticket ID (numbers only)
                </p>
              </div>
              <div class="zf-clearBoth"></div>
            </li>
          </ul>
        </div>
        <ul class="mess">
          <!---------Single Line Ends Here---------->
          <!---------Multiple Line Starts Here--------->
          <li class="zf-tempFrmWrapper zf-large">
            <label class="zf-labelName"> Message </label>
            <div class="zf-tempContDiv" style="margin-top: 8px">
              <span>
                <textarea name="MultiLine" checktype="c1" maxlength="65535" placeholder=""></textarea>
              </span>
              <p id="MultiLine_error" class="zf-errorMessage" style="display: none">
                Invalid value
              </p>
            </div>
            <div class="zf-clearBoth"></div>
          </li>
          <!---------Multiple Line Ends Here---------->
        </ul>
      </div>
      <!---------template Container Starts Here---------->
      <ul>
        <li class="zf-fmFooter">
          <button class="zf-submitColor">SUBMIT</button>
        </li>
      </ul>
      <!-- 'zf-templateWrapper' ends -->
    </form>
  </div>
  <!-- 'zf-templateWidth' ends -->
  <script type="text/javascript">
    var zf_DateRegex = new RegExp(
      "^(([0][1-9])|([1-2][0-9])|([3][0-1]))[-](Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[-](?:(?:19|20)[0-9]{2})$"
    );
    var zf_MandArray = [
      "Name_First",
      "Name_Last",
      "Dropdown",
      "Email",
      "SingleLine2",
    ];
    //var zf_FieldArray = ["Name_First", "Name_Last", "Email", "SingleLine2"];
    var zf_FieldArray = [
      "Name_First",
      "Name_Last",
      "Email",
      "PhoneNumber_countrycode",
      "Dropdown",
      "SingleLine2",
      "SingleLine",
      "MultiLine",
    ];
    var isSalesIQIntegrationEnabled = false;
    var salesIQFieldsArray = [];
  </script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script>
    window.addEventListener('message', function (event) {
      var email = event.data;
      document.getElementById("Email").value = email;
      let checkField = setInterval(function () {
        if ($('#Email').val() !== '') {
          $('#loader').hide();
          clearInterval(checkField);
        }
      }, 100);
      $('#loader').hide();
    });
  </script>
</body>

</html>
